<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>al_witify - Anatomy Space Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 30%, #334155 70%, #0f172a 100%);
            background-size: 400% 400%;
            animation: gradientFlow 25s ease infinite;
            color: white;
            position: relative;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 100%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 0%; }
            100% { background-position: 0% 50%; }
        }

        /* 🔹 Canvas للجزيئات */
        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 🔹 الإضاءة الباردة */
        .ambient-light {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(94, 234, 212, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(129, 140, 248, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(167, 139, 250, 0.05) 0%, transparent 70%);
            z-index: 1;            pointer-events: none;
            animation: lightPulse 15s ease-in-out infinite;
        }

        @keyframes lightPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

        /* 🔹 🌙 القمر - ضوء نيون فقط (بدون دائرة) */
        .moon {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            /* نقطة نيون صغيرة في المركز */
            background: radial-gradient(circle, rgba(129, 140, 248, 0.9) 0%, transparent 70%);
            /* توهج نيون متعدد الطبقات */
            box-shadow: 
                0 0 15px rgba(129, 140, 248, 0.8),
                0 0 30px rgba(129, 140, 248, 0.5),
                0 0 60px rgba(94, 234, 212, 0.35),
                0 0 100px rgba(167, 139, 250, 0.2);
            z-index: 2;
            animation: neonPulse 4s ease-in-out infinite;
        }

        @keyframes neonPulse {
            0%, 100% {
                box-shadow: 
                    0 0 15px rgba(129, 140, 248, 0.8),
                    0 0 30px rgba(129, 140, 248, 0.5),
                    0 0 60px rgba(94, 234, 212, 0.35),
                    0 0 100px rgba(167, 139, 250, 0.2);
            }
            50% {
                box-shadow: 
                    0 0 20px rgba(129, 140, 248, 1),
                    0 0 45px rgba(129, 140, 248, 0.7),
                    0 0 80px rgba(94, 234, 212, 0.5),
                    0 0 130px rgba(167, 139, 250, 0.35);
            }
        }

        /* 🔹 ✨ الشهب الساقطة - اتجاه صحيح للأسفل */
        .shooting-stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;            overflow: hidden;
        }

        .shooting-star {
            position: absolute;
            width: 2px;
            height: 120px;
            /* تدرج من ساطع في الرأس إلى شفاف في الذيل */
            background: linear-gradient(
                180deg, 
                rgba(255, 255, 255, 0) 0%, 
                rgba(129, 140, 248, 0.9) 40%, 
                rgba(255, 255, 255, 1) 70%, 
                rgba(255, 255, 255, 0.8) 100%
            );
            border-radius: 0 0 2px 2px;
            opacity: 0;
            /* دوران ليكون مائلاً أثناء السقوط */
            transform: rotate(35deg);
            transform-origin: top center;
            filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.8)) 
                    drop-shadow(0 0 15px rgba(94, 234, 212, 0.5));
        }

        /* مسارات سقوط مختلفة للشهب */
        .shooting-star:nth-child(1) {
            top: -150px; left: 15%;
            animation: fallDown1 7s ease-in infinite;
            animation-delay: 0s;
        }
        .shooting-star:nth-child(2) {
            top: -150px; left: 55%;
            animation: fallDown2 8.5s ease-in infinite;
            animation-delay: 2.5s;
        }
        .shooting-star:nth-child(3) {
            top: -150px; left: 85%;
            animation: fallDown3 6.5s ease-in infinite;
            animation-delay: 1s;
        }
        .shooting-star:nth-child(4) {
            top: -150px; left: 35%;
            animation: fallDown1 9s ease-in infinite;
            animation-delay: 4s;
        }

        /* 🔹 أنيميشن سقوط الشهب للأسفل بزاوية */
        @keyframes fallDown1 {
            0% {
                transform: rotate(35deg) translateY(0) translateX(0);                opacity: 0;
            }
            10% { opacity: 1; }
            70% { opacity: 0.9; }
            100% {
                transform: rotate(35deg) translateY(120vh) translateX(30vw);
                opacity: 0;
            }
        }

        @keyframes fallDown2 {
            0% {
                transform: rotate(40deg) translateY(0) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            70% { opacity: 0.9; }
            100% {
                transform: rotate(40deg) translateY(130vh) translateX(-20vw);
                opacity: 0;
            }
        }

        @keyframes fallDown3 {
            0% {
                transform: rotate(30deg) translateY(0) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            70% { opacity: 0.9; }
            100% {
                transform: rotate(30deg) translateY(110vh) translateX(-40vw);
                opacity: 0;
            }
        }

        /* ===== الحاويات الزجاجية ===== */
        .screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 20px 0;
        }
        .screen.hidden {
            opacity: 0; transform: scale(0.97);
            pointer-events: none; display: none;
        }

        /* ===== واجهة البداية ===== */
        .intro-content {
            text-align: center; position: relative; z-index: 11;
            max-width: 600px; padding: 20px;
        }

        .logo-ring {
            width: 160px; height: 160px;
            border: 2px solid rgba(129, 140, 248, 0.4);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            position: relative; animation: ringFloat 4s ease-in-out infinite;
            margin: 0 auto 35px auto;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.2);
        }

        @keyframes ringFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .logo-text {
            font-size: 1.9rem; font-weight: 900;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8, #60a5fa);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 5s ease infinite;
            letter-spacing: 1px;
        }

        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            color: rgba(226, 232, 240, 0.85);
            font-size: 1.05rem; margin-bottom: 45px;
            line-height: 1.7; text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        .subtitle span { color: #818cf8; font-weight: 700; }
        .start-btn {
            position: relative; padding: 16px 55px;
            font-size: 1.2rem; font-weight: 700;
            font-family: 'Tajawal', sans-serif; color: #fff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
            background-size: 200% 200%;
            border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
            animation: btnGlow 3s ease infinite;
        }

        @keyframes btnGlow {
            0%, 100% { background-position: 0% 50%; box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35); }
            50% { background-position: 100% 50%; box-shadow: 0 12px 35px rgba(139, 92, 246, 0.5); }
        }

        .start-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.55);
        }

        /* ===== واجهة الأسئلة ===== */
        .quiz-container {
            width: 92%; max-width: 780px;
            position: relative; margin: auto; z-index: 11;
        }

        .quiz-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 28px; padding: 35px 30px;
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03) inset;
        }

        .quiz-card::before {
            content: ''; position: absolute; top: 0; left: 4%;
            width: 92%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(148,163,184,0.4), transparent);
            border-radius: 2px;
        }

        .quiz-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 25px;
            flex-wrap: wrap; gap: 10px;        }

        .question-counter, .score-display {
            color: rgba(226, 232, 240, 0.9);
            font-size: 0.92rem; text-shadow: 0 1px 2px rgba(0,0,0,0.25);
            display: flex; align-items: center; gap: 6px;
        }
        .question-counter span { color: #818cf8; font-weight: 700; font-size: 1.05rem; }
        .score-display span { color: #34d399; font-weight: 700; font-size: 1.1rem; }

        .progress-bar {
            width: 100%; height: 5px;
            background: rgba(148, 163, 184, 0.15);
            border-radius: 10px; margin-bottom: 22px;
            overflow: hidden; position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
            position: relative;
        }

        .progress-fill::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: progressShine 2s infinite;
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .image-container {
            width: 100%; text-align: center; margin-bottom: 18px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 18px; padding: 12px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        .question-img {
            max-width: 100%; max-height: 240px;
            object-fit: contain; border-radius: 10px;
            transition: transform 0.3s ease;
        }        .question-img:hover { transform: scale(1.02); }

        .question-text {
            color: #f1f5f9; font-size: 1.2rem; font-weight: 500;
            line-height: 1.65; margin-bottom: 24px;
            text-align: left; direction: ltr;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4); padding: 8px 0;
        }

        .options-list {
            display: flex; flex-direction: column;
            gap: 12px; direction: ltr;
        }

        .option-btn {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            color: rgba(241, 245, 249, 0.95);
            font-size: 0.98rem; cursor: pointer;
            transition: all 0.28s ease; text-align: left;
            position: relative; overflow: hidden;
        }

        .option-btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(129,140,248,0.15), transparent);
            transition: left 0.4s ease;
        }
        .option-btn:hover::before { left: 100%; }

        .option-btn:hover {
            background: rgba(99, 102, 241, 0.18);
            border-color: rgba(129, 140, 248, 0.45);
            transform: translateX(4px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }

        .option-btn.correct {
            background: rgba(52, 211, 153, 0.22);
            border-color: rgba(52, 211, 153, 0.55);
            animation: correctGlow 0.5s ease;
            box-shadow: 0 0 18px rgba(52, 211, 153, 0.35);
        }
        .option-btn.correct span { color: #34d399; font-weight: 700; }

        .option-btn.wrong {            background: rgba(248, 113, 113, 0.2);
            border-color: rgba(248, 113, 113, 0.5);
            animation: wrongShake 0.45s ease;
            box-shadow: 0 0 18px rgba(248, 113, 113, 0.3);
        }
        .option-btn.wrong span { color: #f87171; }

        .option-btn.disabled { pointer-events: none; opacity: 0.75; }

        @keyframes correctGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.025); box-shadow: 0 0 25px rgba(52,211,153,0.5); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .next-btn {
            display: none; margin-top: 22px; padding: 13px 38px;
            font-size: 1.08rem; font-weight: 700;
            font-family: 'Tajawal', sans-serif; color: #fff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; border-radius: 16px; cursor: pointer;
            transition: all 0.32s ease; float: left;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }
        .next-btn:hover {
            background: linear-gradient(135deg, #7c7df5, #9b7feb);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(139, 92, 246, 0.45);
        }
        .next-btn.show { display: block; animation: fadeInSlide 0.45s ease; }

        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* شاشة النتيجة */
        .result-content { text-align: center; padding: 10px 0; }
        .result-title {
            font-size: 2rem; font-weight: 900; color: #f1f5f9;
            margin-bottom: 12px; text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .result-score {
            font-size: 3.8rem; font-weight: 900;
            background: linear-gradient(135deg, #818cf8, #34d399);            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0 35px 0;
            text-shadow: 0 0 25px rgba(129, 140, 248, 0.45);
            animation: scorePulse 2s ease-in-out infinite;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .restart-btn {
            padding: 15px 48px; font-size: 1.08rem; font-weight: 700;
            font-family: 'Tajawal', sans-serif; color: #fff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
            background-size: 200% 200%; border: none;
            border-radius: 50px; cursor: pointer;
            transition: all 0.35s ease;
            animation: btnGlow 3s ease infinite;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        .restart-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 14px 38px rgba(139, 92, 246, 0.55);
        }

        /* إيموجي تفاعلي */
        .floating-emoji {
            position: absolute; font-size: 2.2rem;
            pointer-events: none;
            animation: floatUpEmoji 1.6s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 12px rgba(255,255,255,0.6);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        @keyframes floatUpEmoji {
            0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-140px) scale(1.4) rotate(25deg); opacity: 0; }
        }

        /* مؤشر استعادة التقدم */
        .progress-restore {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            padding: 25px 40px; border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.3);            z-index: 200; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: none;
        }
        .progress-restore.show { display: block; animation: fadeInUp 0.4s ease; }
        .progress-restore p { color: #e2e8f0; margin-bottom: 15px; font-size: 1.1rem; }
        .progress-restore p:last-of-type {
            font-size: 0.95rem; color: rgba(226,232,240,0.8);
            margin-bottom: 20px;
        }
        .restore-btns { display: flex; gap: 12px; justify-content: center; }
        .restore-btn {
            padding: 10px 24px; border: none; border-radius: 12px;
            font-family: 'Tajawal', sans-serif; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease;
        }
        .restore-btn.continue {
            background: linear-gradient(135deg, #34d399, #10b981); color: white;
        }
        .restore-btn.restart {
            background: rgba(148, 163, 184, 0.2); color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .restore-btn:hover { transform: translateY(-2px); }
        .restore-btn.continue:hover { box-shadow: 0 6px 20px rgba(52,211,153,0.4); }
        .restore-btn.restart:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: rgba(248, 113, 113, 0.4);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen:not(.hidden) .quiz-card,
        .screen:not(.hidden) .intro-content,
        .screen:not(.hidden) .result-content {
            animation: fadeInUp 0.6s ease forwards;
        }

        @media (max-width: 600px) {
            .quiz-card { padding: 28px 20px; border-radius: 24px; }
            .question-text { font-size: 1.08rem; }
            .option-btn { padding: 13px 16px; font-size: 0.93rem; gap: 11px; }
            .logo-ring { width: 130px; height: 130px; }
            .logo-text { font-size: 1.65rem; }
            .moon { top: 20px; right: 20px; width: 6px; height: 6px; }
            .result-score { font-size: 3.2rem; }
            .quiz-header { flex-direction: column; align-items: flex-start; gap: 8px; }        }
    </style>
</head>
<body>

    <!-- Canvas للجزيئات -->
    <canvas id="particleCanvas"></canvas>
    <!-- الإضاءة الباردة -->
    <div class="ambient-light"></div>
    
    <!-- 🌙 القمر - ضوء نيون فقط -->
    <div class="moon"></div>

    <!-- ✨ الشهب الساقطة للأسفل -->
    <div class="shooting-stars">
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <!-- مؤشر استعادة التقدم -->
    <div class="progress-restore" id="progressRestore">
        <p>🎯 تم العثور على تقدم محفوظ!</p>
        <p>السؤال <span id="savedQuestion">1</span> من 47 | النتيجة: <span id="savedScore">0</span></p>
        <div class="restore-btns">
            <button class="restore-btn continue" onclick="continueQuiz()">⏩ متابعة</button>
            <button class="restore-btn restart" onclick="restartQuiz()">🔄 بدء جديد</button>
        </div>
    </div>

    <!-- واجهة البداية -->
    <div class="screen" id="introScreen">
        <div class="intro-content">
            <div class="logo-ring">
                <span class="logo-text">al_witify</span>
            </div>
            <p class="subtitle">اختبار تفاعلي في مادة <span>التشريح 🪿</span></p>
            <button class="start-btn" onclick="startQuiz()"> ابدأ الرحلة الفضائية 🪿</button>
        </div>
    </div>

    <!-- واجهة الأسئلة -->
    <div class="screen hidden" id="quizScreen">
        <div class="quiz-container">
            <div class="quiz-card" id="quizCardBox">
                <div class="quiz-header">
                    <div class="score-display">⭐ النتيجة: <span id="score">0</span></div>
                    <div class="question-counter">السؤال <span id="currentQ">1</span> من <span id="totalQ">47</span></div>
                </div>                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
                <div class="image-container">
                    <img id="questionImg" class="question-img" src="" alt="Anatomy Image">
                </div>
                <div id="questionArea">
                    <div class="question-text" id="questionText"></div>
                    <div class="options-list" id="optionsList"></div>
                </div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">التالي 🪿</button>
            </div>
        </div>
    </div>

    <!-- شاشة النتيجة -->
    <div class="screen hidden" id="resultScreen">
        <div class="quiz-container">
            <div class="quiz-card">
                <div class="result-content">
                    <div class="result-title">انتهت الرحلة! 🌠</div>
                    <div class="result-score"><span id="finalScore">0</span> / 47</div>
                    <button class="restart-btn" onclick="restartQuiz()">🔄 إعادة الاختبار</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== بيانات الأسئلة (كما هي تماماً) =====
        const quizData = [
            { img: "H1.jpg", q: "Identify the pinned structure indicated by the pointer in this section of the eye:", options: ["A) Vitreous humor", "B) Hyaloid canal", "C) Sclera", "D) Lens"], ans: 1 },

        // ===== متغيرات الحالة =====
        let currentQIndex = 0;
        let score = 0;
        const STORAGE_KEY = 'alwitify_anatomy_progress';

        // ===== نظام الصوت =====
        let audioCtx;
        function initAudio() {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            catch(e) { console.log('Audio not supported'); }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(750, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.12);                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.18);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
                osc.start(); osc.stop(audioCtx.currentTime + 0.28);
            }
        }

        // ===== إيموجي تفاعلي =====
        function showEmoji(isCorrect, event) {
            const emoji = document.createElement('div');
            emoji.className = 'floating-emoji';
            emoji.innerText = isCorrect ? '✨🌙🚀' : '☄️💫🔭';
            const rect = event.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2 + window.scrollX;
            const y = rect.top + window.scrollY;
            emoji.style.left = x + 'px'; emoji.style.top = y + 'px';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 1600);
        }

        // ===== نظام الحفظ والاستعادة =====
        function saveProgress() {
            const progress = { currentQIndex: currentQIndex, score: score, timestamp: Date.now() };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const progress = JSON.parse(saved);
                    if (Date.now() - progress.timestamp < 7 * 24 * 60 * 60 * 1000) return progress;
                } catch(e) { console.log('Error loading progress:', e); }
            }
            return null;
        }

        function clearProgress() { localStorage.removeItem(STORAGE_KEY); }

        function checkSavedProgress() {
            const progress = loadProgress();
            if (progress && progress.currentQIndex > 0 && progress.currentQIndex < quizData.length) {
                document.getElementById('savedQuestion').innerText = progress.currentQIndex + 1;
                document.getElementById('savedScore').innerText = progress.score;                document.getElementById('progressRestore').classList.add('show');
                return true;
            }
            return false;
        }

        function continueQuiz() {
            const progress = loadProgress();
            if (progress) { currentQIndex = progress.currentQIndex; score = progress.score; document.getElementById('score').innerText = score; }
            document.getElementById('progressRestore').classList.remove('show'); startQuizFlow();
        }

        function restartQuiz() {
            clearProgress(); currentQIndex = 0; score = 0;
            document.getElementById('progressRestore').classList.remove('show');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('introScreen').style.display = 'flex';
            document.getElementById('introScreen').classList.remove('hidden');
        }

        // ===== Canvas Particles System =====
        function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resize(); window.addEventListener('resize', resize);
            const particles = [];
            const particleCount = Math.min(80, Math.floor(window.innerWidth / 15));
            const colors = ['rgba(129, 140, 248, 0.6)', 'rgba(94, 234, 212, 0.5)', 'rgba(167, 139, 250, 0.4)', 'rgba(255, 255, 255, 0.3)'];
            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4;
                    this.radius = Math.random() * 1.5 + 0.5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = Math.random() * 0.4 + 0.2;
                    this.pulse = Math.random() * Math.PI * 2; this.pulseSpeed = Math.random() * 0.02 + 0.01;
                }
                update() {
                    this.x += this.vx; this.y += this.vy; this.pulse += this.pulseSpeed;
                    const pulseFactor = 0.8 + Math.sin(this.pulse) * 0.3;
                    if (this.x < -10) this.x = canvas.width + 10; if (this.x > canvas.width + 10) this.x = -10;
                    if (this.y < -10) this.y = canvas.height + 10; if (this.y > canvas.height + 10) this.y = -10;
                    return { x: this.x, y: this.y, r: this.radius * pulseFactor, c: this.color, a: this.alpha * pulseFactor };
                }
                draw(ctx, p) {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = p.c.replace('0.6', p.a).replace('0.5', p.a).replace('0.4', p.a).replace('0.3', p.a);                    ctx.fill();
                }
            }
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
            function drawConnections() {
                ctx.strokeStyle = 'rgba(129, 140, 248, 0.08)'; ctx.lineWidth = 0.5;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            const opacity = (120 - dist) / 120 * 0.15;
                            ctx.strokeStyle = `rgba(129, 140, 248, ${opacity})`;
                            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                        }
                    }
                }
            }
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { const props = p.update(); p.draw(ctx, props); });
                drawConnections(); requestAnimationFrame(animate);
            }
            animate();
        }

        // ===== وظائف الاختبار =====
        function startQuiz() {
            initAudio();
            if (checkSavedProgress()) return;
            startQuizFlow();
        }
        function startQuizFlow() {
            document.getElementById('introScreen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('introScreen').style.display = 'none';
                document.getElementById('quizScreen').style.display = 'flex';
                document.getElementById('quizScreen').classList.remove('hidden');
                document.getElementById('totalQ').innerText = quizData.length;
                loadQuestion();
            }, 400);
        }
        function loadQuestion() {
            const qData = quizData[currentQIndex];
            document.getElementById('currentQ').innerText = currentQIndex + 1;
            document.getElementById('questionText').innerText = qData.q;
            document.getElementById('questionImg').src = qData.img;
            const progress = (currentQIndex / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';            const optionsList = document.getElementById('optionsList'); optionsList.innerHTML = '';
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('div'); btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt}</span>`; btn.onclick = (e) => selectAnswer(btn, index, e);
                optionsList.appendChild(btn);
            });
            document.getElementById('nextBtn').classList.remove('show'); saveProgress();
        }
        function selectAnswer(selectedBtn, selectedIndex, event) {
            const qData = quizData[currentQIndex]; const isCorrect = selectedIndex === qData.ans;
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach((btn, idx) => { btn.classList.add('disabled'); if (idx === qData.ans) btn.classList.add('correct'); });
            if (isCorrect) { score++; document.getElementById('score').innerText = score; playSound('correct'); showEmoji(true, event); }
            else { selectedBtn.classList.add('wrong'); playSound('wrong'); showEmoji(false, event); }
            document.getElementById('nextBtn').classList.add('show'); saveProgress();
        }
        function nextQuestion() { currentQIndex++; if (currentQIndex < quizData.length) loadQuestion(); else { clearProgress(); showResult(); } }
        function showResult() {
            document.getElementById('quizScreen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('quizScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'flex';
                document.getElementById('resultScreen').classList.remove('hidden');
                document.getElementById('finalScore').innerText = score;
            }, 400);
        }

        // ===== التهيئة =====
        window.addEventListener('load', () => {
            initParticles();
            window.addEventListener('beforeunload', saveProgress);
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProgress(); });
        });
        window.addEventListener('pagehide', saveProgress);
    </script>
